services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kova_acad_turnos
      POSTGRES_USER: kova
      POSTGRES_PASSWORD: kova_local_password
    ports:
      - "54329:5432"
    volumes:
      - kova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kova -d kova_acad_turnos"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  kova_postgres_data:
